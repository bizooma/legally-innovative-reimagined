    <!-- ElevenLabs Convai Chat Widget -->
    <elevenlabs-convai agent-id="cylHD3Ay9g1H7eGVdSdj"></elevenlabs-convai>
    <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>

    <script>
      // Script to hide chatbots on the admin dashboard page
      (function() {
        function hideChatbotsIfAdminDashboard() {
          // Check if the current URL contains the admin dashboard path
          const isAdminDashboard = window.location.pathname.includes('/portal/admin-dashboard');
          
          // Get the ElevenLabs Convai element
          const elevenlabsWidget = document.querySelector('elevenlabs-convai');
          
          if (isAdminDashboard) {
            // Hide chatbot on admin dashboard
            if (elevenlabsWidget) {
              elevenlabsWidget.style.display = 'none';
            }
          } else {
            // Show chatbot on other pages
            if (elevenlabsWidget) {
              elevenlabsWidget.style.display = '';
            }
          }
        }

        // Run the function when the page loads
        window.addEventListener('load', hideChatbotsIfAdminDashboard);
        
        // Also run when URL changes (for single page applications)
        window.addEventListener('popstate', hideChatbotsIfAdminDashboard);
        
        // For React Router navigation that doesn't trigger popstate
        // Create a MutationObserver to detect DOM changes
        const observer = new MutationObserver(function() {
          hideChatbotsIfAdminDashboard();
        });
        
        // Start observing the document with the configured parameters
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
