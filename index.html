        // Add custom positioning to the Calendly widget
        setTimeout(function() {
          const calendlyWidget = document.querySelector('.calendly-badge-widget');
          if (calendlyWidget) {
            calendlyWidget.style.left = '20px';
            calendlyWidget.style.right = 'auto';
            calendlyWidget.style.bottom = '20px';
          }

    <script>
      // Script to hide chatbots on the admin dashboard page (temporarily modified)
      (function() {
        function hideChatbotsIfAdminDashboard() {
          // Function kept but chatbot elements are currently commented out
        }

        // Run the function when the page loads
        window.addEventListener('load', hideChatbotsIfAdminDashboard);
        
        // Also run when URL changes (for single page applications)
        window.addEventListener('popstate', hideChatbotsIfAdminDashboard);
        
        // For React Router navigation that doesn't trigger popstate
        // Create a MutationObserver to detect DOM changes
        const observer = new MutationObserver(function() {
          hideChatbotsIfAdminDashboard();
        });
        
        // Start observing the document with the configured parameters
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
